<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Radar Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        #chart-container {
            height: 100vh;  /* Use 100% of the viewport height */
            width: 100%;    /* Use 100% of the viewport width */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            aspect-ratio: 1;  /* Maintain a 1:1 aspect ratio */
        }
    </style>
</head>
<body>
    <div id="chart-container">
        <canvas id="radarChart"></canvas>
    </div>
    <script>
      const overlords = {
    france: {
        pay_stability: 0.8,
        determinance: 0.3,
        intelligence_support: 0.6,
        ground_support: 0,
        tech_assistance: 0.8,
        economic_support: 0.8
    },
    usa: {
        pay_stability: 0.9,
        determinance: 0.5,
        intelligence_support: 1,
        ground_support: 0.3,
        tech_assistance: 1,
        economic_support: 1
    },
    russia: {
        pay_stability: 0.5,
        determinance: 0.5,
        intelligence_support: 0.8,
        ground_support: 0.3,
        tech_assistance: 0.5,
        economic_support: 0.5
    },
    china: {
        pay_stability: 0.8,
        determinance: 0.2,
        intelligence_support: 0.4,
        ground_support: 0,
        tech_assistance: 0.8,
        economic_support: 0.8
    },
    uae: {
        pay_stability: 0.9,
        determinance: 0.5,
        intelligence_support: 0.8,
        ground_support: 0.3,
        tech_assistance: 0.6,
        economic_support: 0.9
    },
    israel: {
        pay_stability: 0.7,
        determinance: 1,
        intelligence_support: 0.8,
        ground_support: 0.6,
        tech_assistance: 0.9,
        economic_support: 0.8
    },
    turkey: {
        pay_stability: 0.5,
        determinance: 0.8,
        intelligence_support: 0.7,
        ground_support: 1,
        tech_assistance: 0.5,
        economic_support: 0.5
    },
    iran: {
        pay_stability: 0.3,
        determinance: 0.9,
        intelligence_support: 0.7,
        ground_support: 0.8,
        tech_assistance: 0.3,
        economic_support: 0.3
    }
};

    </script>
    <script>

        const colors = {
            france: { backgroundColor: 'rgba(173, 216, 230, 0.2)', borderColor: 'rgba(173, 216, 230, 1)' }, // Light blue
            usa: { backgroundColor: 'rgba(0, 0, 128, 0.2)', borderColor: 'rgba(0, 0, 128, 1)' }, // Navy blue
            russia: { backgroundColor: 'rgba(255, 255, 255, 0.2)', borderColor: 'rgba(255, 255, 255, 1)' }, // White
            china: { backgroundColor: 'rgba(255, 165, 0, 0.2)', borderColor: 'rgba(255, 165, 0, 1)' }, // Orange
            turkey: { backgroundColor: 'rgba(255, 0, 0, 0.2)', borderColor: 'rgba(255, 0, 0, 1)' }, // Red
            uae: { backgroundColor: 'rgba(0, 100, 0, 0.2)', borderColor: 'rgba(0, 100, 0, 1)' }, // Dark green
            israel: { backgroundColor: 'rgba(255, 255, 0, 0.2)', borderColor: 'rgba(255, 255, 0, 1)' }, // Yellow
            iran: { backgroundColor: 'rgba(144, 238, 144, 0.2)', borderColor: 'rgba(144, 238, 144, 1)' } // Light green
        };

        const datasets = Object.keys(overlords).map(country => ({
            label: country.charAt(0).toUpperCase() + country.slice(1), // Capitalize the first letter
            data: Object.values(overlords[country]),
            backgroundColor: colors[country].backgroundColor,
            borderColor: colors[country].borderColor,
            borderWidth: 1
        }));

        const ctx = document.getElementById('radarChart').getContext('2d');
        const radarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Pay Stability', 'Determinance', 'Intelligence Support', 'Ground Support', 'Tech Assistance', 'Economic Support'],
                datasets: datasets
            },
            options: {
                scales: {
                    r: {
                        angleLines: {
                            display: true
                        },
                        suggestedMin: 0,
                        suggestedMax: 1
                    }
                }
            }
        });
    </script>
</body>
</html>
